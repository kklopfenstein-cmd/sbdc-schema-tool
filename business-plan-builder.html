<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Plan Builder – Miami Valley SBDC</title>
<meta name="description" content="Free business plan builder from the Miami Valley Small Business Development Center. Build your plan step by step, with automatic financial statements, then print it, save it as a PDF or download it as a Word document.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#12355B; --navy-dark:#0A2340; --gold:#B3121F; --gold-bright:#D12A36; --gold-soft:#FF8A93;
    --paper:#F4F7FA; --card:#FFFFFF; --border:#CFD9E4; --ink:#1C2430; --muted:#4A5667; --sky:#E6EEF6;
    --olive:#3F6B4A; --olive-bg:#E9F0EA;
    --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --sans: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --bmc-pink:#FBE1F2; --bmc-blue:#CDEFFB; --bmc-yellow:#FFFBBE; --bmc-green:#E3F0CE;
    --swot-s:#E1F0D8; --swot-w:#FBE2E2; --swot-o:#DCEEFB; --swot-t:#FDEBD3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  body{min-height:100vh;}
  .app{display:grid;grid-template-columns:270px 1fr;min-height:100vh;}
  @media (max-width: 860px){ .app{grid-template-columns:1fr;} .rail{position:static;height:auto;order:2;} .main{order:1;} }

  .rail{ background:var(--navy-dark); color:#EDEBE2; padding:28px 0; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .rail-brand{padding:0 24px 20px 24px;border-bottom:1px solid rgba(255,255,255,0.12);margin-bottom:10px;}
  .rail-brand .k{font-size:11px;letter-spacing:1.5px;color:var(--gold-soft);font-weight:700;text-transform:uppercase;}
  .rail-brand h1{font-size:22px;margin:4px 0 2px 0;font-weight:800;letter-spacing:0.5px;}
  .rail-brand p{margin:0;font-size:12px;color:#B9C3D6;}
  .timeline{list-style:none;margin:14px 0;padding:0 10px;}
  .timeline li{position:relative;}
  .tl-btn{ all:unset;display:flex;gap:12px;align-items:flex-start;width:100%; padding:11px 12px;border-radius:8px;cursor:pointer; }
  .tl-btn:hover{background:rgba(255,255,255,0.06);}
  .tl-btn.active{background:rgba(255,255,255,0.12);}
  .tl-btn:focus-visible{outline:3px solid var(--gold-soft);outline-offset:1px;}
  .tl-node{ flex:0 0 auto;width:22px;height:22px;border-radius:50%; border:2px solid #6C7A93;background:var(--navy-dark);
    display:flex;align-items:center;justify-content:center; font-size:11px;font-weight:700;color:#B9C3D6;margin-top:1px; }
  .tl-btn.active .tl-node{border-color:var(--gold-soft);color:var(--gold-soft);}
  .tl-node.done{background:var(--olive);border-color:var(--olive);color:#fff;}
  .tl-connector{position:absolute;left:22px;top:33px;width:1px;height:calc(100% - 8px);background:rgba(255,255,255,0.16);}
  .tl-text .date{display:block;font-size:10.5px;color:#9CA9C2;letter-spacing:0.5px;text-transform:uppercase;}
  .tl-text .label{display:block;font-size:13.5px;font-weight:600;color:#EDEBE2;line-height:1.3;margin-top:2px;}
  .tl-btn.active .tl-text .label{color:#fff;}
  .rail-actions{padding:16px 22px 0 22px;margin-top:8px;border-top:1px solid rgba(255,255,255,0.12);}
  .rail-actions button{width:100%;}
  .rail-actions .btn-outline{background:transparent;color:#fff;border-color:rgba(255,255,255,0.45);} .rail-actions .btn-outline:hover{background:rgba(255,255,255,0.1);}
  .rail-note{font-size:11.5px;color:#B9C3D6;line-height:1.5;padding:16px 22px 0 22px;margin:0;}
  .rail-note a{color:#fff;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  .skip:focus{position:absolute;left:8px;top:8px;width:auto;height:auto;clip:auto;background:#fff;color:var(--navy);padding:8px 12px;z-index:10;font-weight:700;}
  .cta{background:#fff;border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:6px;padding:14px 18px;margin:26px 0 0 0;font-size:14px;}
  .cta a{color:var(--navy);font-weight:700;}

  .main{padding:36px 44px 80px 44px;max-width:900px;min-width:0;}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .table-scroll:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  @media (max-width:640px){ .dyn-table{min-width:560px;} .field label{flex-wrap:wrap;} }
  @media (max-width:860px){.main{padding:24px 20px 60px 20px;}}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;gap:16px;flex-wrap:wrap;}
  .save-indicator{font-size:12.5px;color:var(--olive);opacity:0;transition:opacity .4s;font-weight:600;}
  .save-indicator.show{opacity:1;}

  .btn{ font-family:var(--sans);font-size:13.5px;font-weight:600;border-radius:7px;border:1px solid transparent; padding:9px 16px;cursor:pointer;transition:.15s; }
  .btn-primary{background:var(--navy);color:#fff;} .btn-primary:hover{background:var(--navy-dark);}
  .btn-gold{background:var(--gold);color:#fff;} .btn-gold:hover{background:#8E0D18;}
  .btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  .btn-ghost{background:transparent;color:#EDEBE2;border-color:rgba(255,255,255,0.3);} .btn-ghost:hover{background:rgba(255,255,255,0.08);}
  .btn-outline{background:#fff;color:var(--navy);border-color:var(--navy);} .btn-outline:hover{background:#EEF1F6;}
  .btn-danger{color:#9C3B3B;border-color:#E0B9B9;} .btn-danger:hover{background:#FBEDED;}
  .btn-sm{padding:5px 10px;font-size:12px;}

  h2.section-title{font-size:26px;margin:0 0 2px 0;color:var(--navy);font-weight:800;}
  .session-tag{font-size:13.5px;color:var(--muted);margin-bottom:22px;display:block;}
  .callout{ background:var(--sky);border-left:4px solid var(--navy);padding:10px 14px;border-radius:4px;
    font-size:13.5px;color:#1C2E45;margin-bottom:22px; }
  .callout a{color:var(--navy);font-weight:700;}
  .notice{ background:#EAF3FB;border-left:4px solid #2B6CB0;padding:12px 16px;border-radius:4px;
    font-size:13.5px;color:#1a3a57;margin-bottom:22px; }
  .notice strong{color:#123452;}
  .notice a{color:#2B6CB0;font-weight:700;text-decoration:underline;}
  .warning{ background:#FDF0E4;border-left:4px solid #C2680A;padding:12px 16px;border-radius:4px;
    font-size:13.5px;color:#7a3d05;margin-bottom:22px; }
  .warning strong{color:#5c2e04;}
  .info-list{padding-left:22px;margin:0 0 18px 0;}
  .info-list li{margin-bottom:8px;font-size:14.5px;line-height:1.55;}
  .info-list li b{color:var(--navy);}

  .field{margin-bottom:18px;}
  .field label{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--navy);margin-bottom:6px;}
  .field .hint{font-weight:400;color:var(--muted);font-style:italic;font-size:12.5px;}
  input[type=text], textarea, select{ width:100%;font-family:var(--sans);font-size:14px;color:var(--ink);
    border:1px solid var(--border);border-radius:7px;padding:10px 12px;background:#fff;resize:vertical; }
  input[type=text]:focus, textarea:focus, select:focus{outline:3px solid var(--gold);outline-offset:1px;border-color:var(--navy);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  @media (max-width:640px){.row2,.row3{grid-template-columns:1fr;}}
  h3.sub{font-size:17px;color:var(--navy);margin:32px 0 4px 0;border-bottom:3px solid var(--navy);display:inline-block;padding-bottom:3px;}

  .dyn-table{width:100%;border-collapse:collapse;margin-top:12px;}
  .dyn-table th{background:var(--navy);color:#fff;font-size:12.5px;text-align:left;padding:8px 10px;}
  .dyn-table td{padding:6px;border-bottom:1px solid var(--border);vertical-align:top;}
  .dyn-table input, .dyn-table textarea{font-size:13px;padding:7px 9px;}
  .rm-row{background:transparent;border:none;color:#9C3B3B;cursor:pointer;font-size:16px;line-height:1;padding:4px 6px;}
  .add-row-btn{margin-top:10px;}
  .checklist-item{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14.5px;}
  .checklist-item input{width:17px;height:17px;}
  .calc-box{margin:4px 0 20px 0;}
  .calc-placeholder{font-size:13px;color:var(--muted);font-style:italic;margin:0;}
  .calc-result{background:var(--olive-bg);border:1px solid var(--olive);border-radius:8px;padding:12px 14px;font-size:14px;color:#20351f;}
  .calc-result strong{color:var(--olive);}
  .calc-warning{background:#FBEDED;border:1px solid #E0B9B9;border-radius:8px;padding:12px 14px;font-size:13.5px;color:#7a2020;}
  .resume-row{border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:12px;background:#fff;}
  .resume-row input[type=file]{padding:6px 8px;font-size:13px;}
  .doc .resume-img-slot{margin:4px 0 14px 0;}
  .nav-footer{display:flex;justify-content:space-between;margin-top:36px;padding-top:20px;border-top:1px solid var(--border);}

  /* ---------- Business Model Canvas ---------- */
  .bmc-grid{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
    grid-template-rows: auto auto auto;
    grid-template-areas:
      "partners activities value relationships segments"
      "partners resources   value channels      segments"
      "cost     cost        cost  revenue        revenue";
    gap:10px;margin-top:14px;
  }
  @media (max-width:820px){
    .bmc-grid{ grid-template-columns:1fr 1fr;
      grid-template-areas:
        "partners activities" "partners resources"
        "value value" "relationships channels"
        "segments segments" "cost revenue"; }
  }
  .bmc-cell{border-radius:8px;padding:10px 12px;}
  .bmc-cell.c-pink{background:var(--bmc-pink);} .bmc-cell.c-blue{background:var(--bmc-blue);}
  .bmc-cell.c-yellow{background:var(--bmc-yellow);} .bmc-cell.c-green{background:var(--bmc-green);}
  .bmc-cell label{font-size:12px;margin-bottom:5px;}
  .bmc-cell textarea{background:rgba(255,255,255,0.6);}

  /* ---------- SWOT ---------- */
  .swot-grid{ display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;
    grid-template-areas:"strengths weaknesses" "opportunities threats"; gap:10px;margin-top:14px; }
  @media (max-width:600px){.swot-grid{grid-template-columns:1fr;grid-template-areas:"strengths" "weaknesses" "opportunities" "threats";}}
  .swot-cell{border-radius:8px;padding:10px 12px;}
  .swot-cell.s{background:var(--swot-s);} .swot-cell.w{background:var(--swot-w);}
  .swot-cell.o{background:var(--swot-o);} .swot-cell.t{background:var(--swot-t);}
  .swot-cell textarea{background:rgba(255,255,255,0.6);}

  /* ---------- Style picker ---------- */
  .style-picker{ background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:22px; display:flex;gap:26px;flex-wrap:wrap; }
  .style-picker .picker-group{flex:1;min-width:220px;}
  .style-picker .picker-label{display:block;font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
  .style-picker .picker-desc{font-size:12px;color:var(--muted);margin-top:5px;font-style:italic;}
  .section-toggle-list{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto;}
  .section-toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);cursor:pointer;}
  .section-toggle input{width:15px;height:15px;flex:0 0 auto;}
  .swatch-row{display:flex;gap:8px;}
  .swatch{ flex:1;border:2px solid var(--border);border-radius:8px;padding:8px 6px;cursor:pointer;text-align:center;
    font-size:12px;font-weight:600;color:var(--ink);background:#fff;transition:.15s;font-family:var(--sans); }
  .swatch.active{border-color:var(--navy);background:var(--sky);color:var(--navy);}
  .swatch:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  .swatch .dot{width:16px;height:16px;border-radius:50%;margin:0 auto 5px auto;}

  /* ---------- Preview / printable document ---------- */
  .preview-wrap{background:#D5DEE8;padding:30px;border-radius:8px;}
  @media (max-width:640px){.preview-wrap{padding:10px;} .doc{padding:28px 20px !important;}}
  .doc{
    --d-heading:#12355B; --d-accent:#B3121F; --d-font:Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --d-rule-top:3px solid var(--d-accent); --d-h2-border:2px solid var(--d-accent);
    --d-table-head-bg:#12355B; --d-table-head-color:#fff; --d-check:#3F6B4A;
    --d-title-transform:none; --d-h2-transform:none;
    background:#fff;max-width:800px;margin:0 auto;padding:60px 64px;
    font-family:var(--d-font);color:#222;box-shadow:0 4px 24px rgba(0,0,0,0.15);border-radius:2px;
  }
  .doc.theme-modern{ --d-heading:#1B3B3C; --d-accent:#0F8B8D; --d-font:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
    --d-table-head-bg:#0F8B8D; --d-check:#0F8B8D; --d-h2-transform:uppercase; }
  .doc.theme-minimal{ --d-heading:#111111; --d-accent:#111111; --d-font:Georgia, 'Times New Roman', serif;
    --d-table-head-bg:#ffffff; --d-table-head-color:#111111; --d-check:#111111;
    --d-title-transform:uppercase; --d-h2-transform:uppercase; }
  .doc h1.doc-title{font-size:34px;color:var(--d-heading);text-align:center;margin-bottom:2px;letter-spacing:1px;text-transform:var(--d-title-transform);}
  .doc .doc-sub{text-align:center;color:var(--d-accent);font-style:italic;margin-bottom:6px;}
  .doc.theme-modern .doc-sub{font-style:normal;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:12px;}
  .doc.theme-minimal .doc-sub{font-style:normal;letter-spacing:2px;font-size:12px;color:#555;}
  .doc .doc-meta{text-align:center;font-size:13px;color:#555;margin-bottom:36px;font-family:var(--sans);}
  .doc hr.gold{border:none;border-top:var(--d-rule-top);margin:0 0 30px 0;}
  .doc.theme-minimal hr.gold{border-top:1px solid #111;}
  .doc h2.doc-h2{font-size:21px;color:var(--d-heading);margin:34px 0 12px 0;text-transform:var(--d-h2-transform);letter-spacing:0.3px;border-bottom:var(--d-h2-border);padding-bottom:5px;}
  .doc.theme-modern h2.doc-h2{border-bottom:none;border-left:5px solid var(--d-accent);padding:2px 0 2px 12px;font-size:17px;}
  .doc.theme-minimal h2.doc-h2{border-bottom:1px solid #111;font-weight:400;font-size:16px;}
  .doc h3.doc-h3{font-size:16px;color:var(--d-heading);margin:20px 0 6px 0;}
  .doc.theme-modern h3.doc-h3{font-family:var(--sans);font-size:13px;text-transform:uppercase;letter-spacing:0.5px;color:var(--d-accent);}
  .doc.theme-minimal h3.doc-h3{font-style:italic;font-weight:400;color:#333;}
  .doc p.doc-p{font-size:14.5px;line-height:1.65;margin:0 0 10px 0;white-space:pre-wrap;}
  .doc .empty{color:#9a9585;font-style:italic;}
  .doc table{width:100%;border-collapse:collapse;margin:10px 0 18px 0;font-size:13px;}
  .doc table th{background:var(--d-table-head-bg);color:var(--d-table-head-color);padding:7px 9px;text-align:left;font-family:var(--sans);font-size:11.5px;}
  .doc.theme-minimal table th{border-bottom:1.5px solid #111;}
  .doc table td{padding:7px 9px;border-bottom:1px solid #ddd;}
  .doc .bmc-doc{ display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:auto auto auto;
    grid-template-areas:"partners activities value relationships segments" "partners resources value channels segments" "cost cost cost revenue revenue";
    gap:1px;background:#ddd;border:1px solid #ddd;margin:12px 0 20px 0; }
  .doc .bmc-doc > div{background:#fff;}
  .doc .bmc-doc .hd{background:var(--d-table-head-bg);color:var(--d-table-head-color);font-family:var(--sans);font-weight:700;font-size:11px;padding:6px 8px;}
  .doc .bmc-doc .bx-content{padding:8px;font-size:12px;flex:1;}
  .doc.theme-minimal .bmc-doc .hd{border-bottom:1.5px solid #111;background:#fff;color:#111;}
  .doc .swot-doc{ display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#ddd;border:1px solid #ddd;margin:12px 0 20px 0; }
  .doc .swot-doc > div{background:#fff;padding:10px;font-size:12.5px;}
  .doc .swot-doc .hd{background:var(--d-table-head-bg);color:var(--d-table-head-color);font-family:var(--sans);font-weight:700;font-size:11px;}
  .doc.theme-minimal .swot-doc .hd{border-bottom:1.5px solid #111;background:#fff;color:#111;}
  .doc .doc-check{font-size:14px;margin:4px 0;}
  .doc .doc-check .box{display:inline-block;width:13px;height:13px;border:1.5px solid var(--d-heading);margin-right:8px;vertical-align:middle;position:relative;top:-1px;}
  .doc .doc-toc{list-style:none;padding:0;margin:0 0 10px 0;}
  .doc .doc-toc li{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dotted #ccc;font-size:14px;font-family:var(--sans);}
  .doc .lean-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px;}
  @media (max-width:600px){.doc .lean-grid{grid-template-columns:1fr;}}
  .doc .lean-block{border:1px solid #e2ded0;border-radius:8px;padding:14px 16px;background:#fdfcf9;}
  .doc.theme-modern .lean-block{border-color:#d7e9e9;background:#f5fbfb;border-radius:4px;}
  .doc.theme-minimal .lean-block{border:none;border-bottom:1px solid #111;border-radius:0;background:#fff;padding:10px 0;}
  .doc .lean-block h3.doc-h3{margin-top:0;}

  /* ---------- Page numbers (structured formats only) ---------- */
  .doc .doc-toc li .toc-page{font-family:var(--sans);color:var(--muted);font-size:12.5px;padding-left:10px;}

  @page{ size: letter; margin-top:0.75in; margin-bottom:0.85in; margin-left:0.75in; margin-right:0.75in;
    @bottom-center{ content: counter(page); font-family: sans-serif; font-size: 9pt; color:#666; }
  }
  @page appendixPage{ size: letter; margin-top:0.75in; margin-bottom:0.85in; margin-left:0.75in; margin-right:0.75in;
    @bottom-center{ content: none; }
  }

  @media print{
    .rail, .topbar, .nav-footer, .style-picker, .cta, .skip{display:none !important;}
    .preview-wrap{background:#fff;padding:0;}
    .doc{box-shadow:none;padding:0;max-width:100%;}
    body{background:#fff;}
    .app{display:block;}
    .doc .doc-appendix-wrap{page-break-before:always;page:appendixPage;}
    .doc h2.doc-h2{page-break-after:avoid;}
    .doc table{page-break-inside:avoid;break-inside:avoid;}
    .doc .bmc-doc{page-break-inside:avoid;break-inside:avoid;}
    .doc .swot-doc{page-break-inside:avoid;break-inside:avoid;}
    .doc .lean-block{page-break-inside:avoid;break-inside:avoid;}
    .doc .doc-check{page-break-inside:avoid;break-inside:avoid;}
  }
</style>
</head>
<body>
<a class="sr skip" href="#main">Skip to the form</a>
<div class="app">
  <nav class="rail" id="rail" aria-label="Plan steps"></nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<script>
/* ============ DATA MODEL ============ */
const SECTIONS = [
  {id:'instructions', date:'Start Here', label:'How to Use This Tool'},
  {id:'business', date:'Setup', label:'Business Basics'},
  {id:'s1', date:'Step 1', label:'Foundations'},
  {id:'s2', date:'Step 2', label:'Customer & Market'},
  {id:'s3', date:'Step 3', label:'Branding & Sales'},
  {id:'s4', date:'Step 4', label:'Financials'},
  {id:'s5', date:'Step 5', label:'Pricing'},
  {id:'s6', date:'Step 6', label:'Operations'},
  {id:'s7', date:'Step 7', label:'Finalize & Review'},
  {id:'exec', date:'Step 8 — write last', label:'Executive Summary'},
  {id:'preview', date:'Finish', label:'Preview & Print Plan'}
];

function defaultData(){
  return {
    business:{name:'',owner:'',structure:'',location:'',planDate:''},
    settings:{format:'traditional', theme:'classic', excludedSections:[]},
    s1:{mission:'',vision:'',vpSegment:'',vpProblem:'',vpProduct:'',vpBenefit:'',vpDiff:'',
        bmc:{partners:'',activities:'',value:'',relationships:'',segments:'',resources:'',channels:'',costs:'',revenue:''}},
    s2:{demo:'',needs:'',alt:'',size:'',tam:'',trends:'',
        competitors:[{name:'',strengths:'',weaknesses:'',diff:''}],
        swot:{strengths:'',weaknesses:'',opportunities:'',threats:''},
        tools:''},
    s3:{brandName:'',personality:'',tagline:'',colors:'',pitch:'',messages:'',
        channels:'',process:'',goals:''},

/* ============ STORAGE ============ */
/* Saves only in this browser on this device (localStorage). Nothing is sent to the SBDC or anyone else.
   Use Download a backup / Open a backup to move a plan between devices. */
async function storageGet(key){
  try{ return localStorage.getItem(LOCAL_PREFIX+key); }catch(e){ return null; }
}
async function storageSet(key, value){
  try{ localStorage.setItem(LOCAL_PREFIX+key, value); return true; }catch(e){ return false; }
}
async function storageDelete(key){
  try{ localStorage.removeItem(LOCAL_PREFIX+key); }catch(e){ /* ignore */ }
}

async function loadData(){
  try{
    const value = await storageGet('plan-data');
    if(value){
      const loaded = JSON.parse(value);
      data = deepMerge(defaultData(), loaded);
    }
  }catch(e){ /* no saved data yet — use defaults */ }
  renderAll();
}
function deepMerge(base, incoming){
  if(Array.isArray(base)) return Array.isArray(incoming) ? incoming : base;
  if(typeof base === 'object' && base !== null){
    const out = {...base};
    for(const k in base){ out[k] = deepMerge(base[k], incoming ? incoming[k] : undefined); }
    return out;
  }
  return incoming !== undefined ? incoming : base;
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    const ok = await storageSet('plan-data', JSON.stringify(data));
    if(ok) flashSaved(); else showSaveProblem();
  }, 700);
}

  const el = document.getElementById('saveIndicator');

/* ============ HELPERS ============ */
function esc(s){ return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function val(v){ return v && v.trim() !== '' ? esc(v) : null; }
function setPath(obj, path, value){
  const keys = path.split('.'); let o = obj;
  for(let i=0;i<keys.length-1;i++){ o = o[keys[i]]; }
  o[keys[keys.length-1]] = value;
}
function getPath(obj, path){ return path.split('.').reduce((o,k)=>o&&o[k], obj); }
function fldId(path){ return 'fld-' + path.replace(/\./g,'-'); }
function uid(){ return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function humanSize(bytes){
  if(!bytes) return '0 KB';
  if(bytes < 1024*1024) return Math.round(bytes/1024)+' KB';
  return (bytes/1024/1024).toFixed(1)+' MB';
}

/* ---- Break-even calculator ---- */
function parseNum(v){
  if(v === null || v === undefined) return NaN;
  const cleaned = v.toString().replace(/[^0-9.\-]/g,'');
  return cleaned === '' || cleaned === '-' ? NaN : parseFloat(cleaned);
}
function calcBreakEven(){
  const box = document.getElementById('breakEvenCalc');
  if(!box) return;
  const fixed = parseNum(data.s4.fixedCosts);
  const varCost = parseNum(data.s4.variableCost);
  const price = parseNum(data.s4.price);

  if(isNaN(fixed) || isNaN(varCost) || isNaN(price)){
    box.innerHTML = `<p class="calc-placeholder">Enter fixed costs, variable cost, and price above and this will calculate your break-even point automatically.</p>`;
    return;
  }
  const margin = price - varCost;
  if(margin <= 0){
    box.innerHTML = `<div class="calc-warning">Your price ($${price.toFixed(2)}) isn't higher than your variable cost per unit ($${varCost.toFixed(2)}) — at these numbers you can't break even no matter how many units you sell. Try raising your price or lowering your variable cost.</div>`;
    return;
  }
  const units = fixed / margin;
  const unitsRounded = Math.ceil(units);
  const revenue = unitsRounded * price;
  const summary = unitsRounded.toLocaleString()+' units per month (about $'+revenue.toLocaleString(undefined,{maximumFractionDigits:0})+' in monthly revenue)';
  box.innerHTML = `<div class="calc-result">
    <strong>Calculated break-even:</strong> ${esc(summary)}
    <div style="margin-top:8px;"><button type="button" class="btn btn-outline btn-sm" onclick="useCalculatedBreakEven()">Use this number</button></div>
  </div>`;
  box.dataset.calculated = summary;
}
function useCalculatedBreakEven(){
  const box = document.getElementById('breakEvenCalc');
  const summary = box && box.dataset.calculated;
  if(!summary) return;
  setPath(data, 's4.breakeven', summary);
  scheduleSave();
  updateNode('s4');
  const el = document.getElementById(fldId('s4.breakeven'));
  if(el) el.value = summary;
}

/* ============ FINANCIAL STATEMENT ENGINE (computed from raw data, shown in Appendix) ============ */
function fmtMoney(n){
  if(n === null || n === undefined || isNaN(n)) return '—';
  const neg = n < 0;
  const str = '$'+Math.abs(n).toLocaleString(undefined,{maximumFractionDigits:0});
  return neg ? '('+str+')' : str;
}
function sumField(rows, key){
  return (rows||[]).reduce((total,r)=>{ const n = parseNum(r[key]); return isNaN(n) ? total : total+n; }, 0);
}
function computeIncomeStatement(){
  const rows = data.s4.income || [];
  const quarters = ['q1','q2','q3','q4'];
  const revenueOther=[0,0,0,0], cogsOther=[0,0,0,0], opexOther=[0,0,0,0];
  rows.forEach(r=>{
    const bucket = r.type === 'Revenue' ? revenueOther : r.type === 'Cost of Goods Sold' ? cogsOther : r.type === 'Operating Expense' ? opexOther : null;
    if(!bucket) return;
    quarters.forEach((q,idx)=>{ const n = parseNum(r[q]); if(!isNaN(n)) bucket[idx]+=n; });
  });
  const rf = computeRevenueForecast();
  const revenueProduct = rf.quarterlyRevenue;
  const cogsProduct = rf.quarterlyCogs;
  const revenue = revenueOther.map((v,idx)=> v + revenueProduct[idx]);
  const cogs = cogsOther.map((v,idx)=> v + cogsProduct[idx]);
  const payroll = computePayrollCost();
  const opexPayrollGross = payroll.quarterlyGross;
  const opexPayrollBurden = payroll.quarterlyBurden;
  const opexPayrollBenefits = payroll.quarterlyBenefits;
  const opexPayroll = payroll.quarterly;
  const opex = opexOther.map((v,idx)=> v + opexPayroll[idx]);
  const grossProfit = revenue.map((v,idx)=> v - cogs[idx]);
  const netIncome = grossProfit.map((v,idx)=> v - opex[idx]);
  const total = arr => arr.reduce((a,b)=>a+b,0);
  return { revenue, revenueProduct, revenueOther, cogs, cogsProduct, cogsOther, grossProfit,
    opexOther, opexPayrollGross, opexPayrollBurden, opexPayrollBenefits, opexPayroll, opex, netIncome,
    totals:{ revenue:total(revenue), revenueProduct:total(revenueProduct), revenueOther:total(revenueOther),
      cogs:total(cogs), cogsProduct:total(cogsProduct), cogsOther:total(cogsOther), grossProfit:total(grossProfit),
      opexOther:total(opexOther), opexPayrollGross:total(opexPayrollGross), opexPayrollBurden:total(opexPayrollBurden),
      opexPayrollBenefits:total(opexPayrollBenefits), opexPayroll:total(opexPayroll), opex:total(opex), netIncome:total(netIncome) } };
}
function hasCategorizedIncome(){ return (data.s4.income||[]).some(r=>r.type); }
function computeFundingTotals(){
  let loan=0, equity=0;
  (data.s6.funding||[]).forEach(f=>{
    const n = parseNum(f.amount);
    if(isNaN(n)) return;
    if(f.type === 'Loan / Debt') loan += n;
    else if(f.type === 'Equity / Investment' || f.type === 'Grant (no repayment)') equity += n;
  });
  return { loan, equity, total: loan+equity };
}
function computeStartupTotal(){ return sumField(data.s4.startup, 'cost'); }

/* ---- Staffing / payroll ---- */
function computePayrollCost(){
  const burdenPctRaw = parseNum(data.s6.burdenRate);
  const burdenPct = isNaN(burdenPctRaw) ? 11 : burdenPctRaw;
  const burdenMultiplier = 1 + (burdenPct/100);
  let monthlyGross = 0, monthlyBurdened = 0, monthlyBenefits = 0;
  (data.s6.roles||[]).forEach(r=>{
    const benefits = parseNum(r.benefits);
    if(!isNaN(benefits)) monthlyBenefits += benefits;
    const rate = parseNum(r.rate);
    const hours = parseNum(r.hours);
    if(isNaN(rate) || isNaN(hours)) return;
    const gross = rate*hours;
    monthlyGross += gross;
    monthlyBurdened += (r.type === 'Contract') ? gross : gross*burdenMultiplier;
  });
  const monthlyBurdenAmount = monthlyBurdened - monthlyGross;
  const monthlyTotal = monthlyBurdened + monthlyBenefits;
  const quarterlyGross = monthlyGross*3;
  const quarterlyBurden = monthlyBurdenAmount*3;
  const quarterlyBenefits = monthlyBenefits*3;
  const quarterlyAmount = monthlyTotal*3;
  return {
    monthlyGross, monthlyBurdened, monthlyBurdenAmount, monthlyBenefits, monthlyTotal, burdenPct,
    quarterlyGross: [quarterlyGross, quarterlyGross, quarterlyGross, quarterlyGross],
    quarterlyBurden: [quarterlyBurden, quarterlyBurden, quarterlyBurden, quarterlyBurden],
    quarterlyBenefits: [quarterlyBenefits, quarterlyBenefits, quarterlyBenefits, quarterlyBenefits],
    quarterly: [quarterlyAmount, quarterlyAmount, quarterlyAmount, quarterlyAmount],
    annual: monthlyTotal*12
  };
}
function calcPayroll(){
  const box = document.getElementById('payrollCalc');
  if(!box) return;
  const p = computePayrollCost();
  if(p.monthlyGross <= 0 && p.monthlyBenefits <= 0){
    box.innerHTML = `<p class="calc-placeholder">Add an hourly rate and hours/month (and benefits, if offered) for each role above to calculate your total staffing cost automatically.</p>`;
    return;
  }
  const benefitsLine = p.monthlyBenefits > 0 ? `, plus ${fmtMoney(p.monthlyBenefits)}/month in benefits` : '';
  box.innerHTML = `<div class="calc-result">
    <strong>Estimated staffing cost:</strong> ${fmtMoney(p.monthlyGross)}/month in gross wages, plus ${fmtMoney(p.monthlyBurdenAmount)}/month in payroll burden (${p.burdenPct}%)${benefitsLine} = <strong>${fmtMoney(p.monthlyTotal)}/month</strong> total (about ${fmtMoney(p.annual)}/year). This is automatically included as an Operating Expense in your Appendix projections.
  </div>`;
}

/* ---- Revenue forecast by product line ---- */
function computeRevenueForecast(){
  const rows = data.s4.revenueForecast || [];
  const qKeys = ['unitsQ1','unitsQ2','unitsQ3','unitsQ4'];
  const quarterlyRevenue = [0,0,0,0], quarterlyCogs = [0,0,0,0];
  const lines = rows.map(r=>{
    const price = parseNum(r.price);
    const cogs = parseNum(r.cogsPerUnit);
    const hasPrice = !isNaN(price), hasCogs = !isNaN(cogs);
    const margin = (hasPrice && hasCogs) ? price - cogs : null;
    const unitsByQ = qKeys.map(k => parseNum(r[k]));
    const revenueByQ = unitsByQ.map(u => (hasPrice && !isNaN(u)) ? price*u : 0);
    const cogsByQ = unitsByQ.map(u => (hasCogs && !isNaN(u)) ? cogs*u : 0);
    revenueByQ.forEach((v,idx)=> quarterlyRevenue[idx]+=v);
    cogsByQ.forEach((v,idx)=> quarterlyCogs[idx]+=v);
    const totalUnits = unitsByQ.reduce((a,b)=> a+(isNaN(b)?0:b), 0);
    const lineRevenueTotal = revenueByQ.reduce((a,b)=>a+b,0);
    const lineCogsTotal = cogsByQ.reduce((a,b)=>a+b,0);
    return { product:r.product, price, cogs, margin, unitsByQ, totalUnits, revenueByQ, cogsByQ, lineRevenueTotal, lineCogsTotal };
  });
  const annualRevenue = quarterlyRevenue.reduce((a,b)=>a+b,0);
  const annualCogs = quarterlyCogs.reduce((a,b)=>a+b,0);
  return { lines, quarterlyRevenue, quarterlyCogs, annualRevenue, annualCogs, annualMargin: annualRevenue-annualCogs };
}
function calcRevenueForecast(){
  const box = document.getElementById('revenueForecastCalc');
  if(!box) return;
  const rf = computeRevenueForecast();
  const validLines = rf.lines.filter(l=> l.margin!==null);
  if(!validLines.length){
    box.innerHTML = `<p class="calc-placeholder">Add a sales price and COGS per unit for each product line to calculate margin automatically.</p>`;
    return;
  }
  let html = '';
  validLines.forEach(l=>{
    const qParts = l.unitsByQ.map((u,idx)=> isNaN(u) ? null : `Q${idx+1}: ${u}`).filter(Boolean).join(', ');
    const detail = l.totalUnits>0
      ? ` — ${l.totalUnits} units/year (${qParts}) = ${fmtMoney(l.lineRevenueTotal - l.lineCogsTotal)} gross margin for the year`
      : ' — add units per quarter to project totals';
    html += `<div style="margin-bottom:6px;"><strong>${esc(l.product||'Product')}:</strong> ${fmtMoney(l.margin)} margin per unit${detail}</div>`;
  });
  const qMargins = rf.quarterlyRevenue.map((v,idx)=> v - rf.quarterlyCogs[idx]);
  html += `<div style="margin-top:8px;padding-top:8px;border-top:1px solid #cfcabb;"><strong>Gross margin by quarter:</strong> Q1 ${fmtMoney(qMargins[0])} &middot; Q2 ${fmtMoney(qMargins[1])} &middot; Q3 ${fmtMoney(qMargins[2])} &middot; Q4 ${fmtMoney(qMargins[3])} (about ${fmtMoney(rf.annualRevenue)}/year in revenue). This is automatically included in your Appendix projections.</div>`;
  box.innerHTML = `<div class="calc-result">${html}</div>`;
}

/* ---- Loan amortization ---- */
function amortizeLoan(principal, annualRatePct, termMonths){
  const n = Math.round(termMonths);
  if(!n || n<=0 || isNaN(principal)) return null;
  const r = (parseNum(annualRatePct)||0)/100/12;
  let payment;
  if(!r){ payment = principal/n; }
  else { payment = principal*(r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1); }
  let balance = principal;
  const monthlyPayments = [];
  const monthsToSim = Math.min(12,n);
  for(let m=0;m<monthsToSim;m++){
    const interestPortion = r ? balance*r : 0;
    let principalPortion = payment - interestPortion;
    let actualPayment = payment;
    if(principalPortion > balance){ principalPortion = balance; actualPayment = principalPortion + interestPortion; }
    balance -= principalPortion;
    monthlyPayments.push({payment:actualPayment, interest:interestPortion, principal:principalPortion});
    if(balance <= 0.005){ balance = 0; break; }
  }
  const interestPaidY1 = monthlyPayments.reduce((s,p)=>s+p.interest,0);
  const principalPaidY1 = monthlyPayments.reduce((s,p)=>s+p.principal,0);
  return { payment, monthlyPayments, interestPaidY1, principalPaidY1, remainingBalance: Math.max(0,balance) };
}
function computeLoanSchedules(){
  return (data.s6.funding||[]).filter(f=>f.type==='Loan / Debt').map(f=>{
    const principal = parseNum(f.amount);
    if(isNaN(principal)) return null;
    const rate = parseNum(f.rate);
    const term = parseNum(f.term);
    if(isNaN(rate) || isNaN(term) || term<=0){
      return { source:f.source, principal, amortized:false, remainingBalance:principal,
        interestPaidY1:0, principalPaidY1:0, monthlyPayments:[], payment:null };
    }
    const amort = amortizeLoan(principal, rate, term);
    if(!amort) return { source:f.source, principal, amortized:false, remainingBalance:principal,
      interestPaidY1:0, principalPaidY1:0, monthlyPayments:[], payment:null };
    return { source:f.source, principal, rate, term, amortized:true, ...amort };
  }).filter(Boolean);
}
function computeQuarterlyLoanPayments(){
  const totals = [0,0,0,0];
  computeLoanSchedules().forEach(s=>{
    (s.monthlyPayments||[]).forEach((mp, monthIdx)=>{
      const q = Math.floor(monthIdx/3);
      if(q>=0 && q<4) totals[q]+=mp.payment;
    });
  });
  return totals;
}
function computeLoanTotals(){
  const schedules = computeLoanSchedules();
  return {
    interest: schedules.reduce((s,x)=>s+x.interestPaidY1,0),
    principal: schedules.reduce((s,x)=>s+x.principalPaidY1,0),
    remaining: schedules.reduce((s,x)=>s+x.remainingBalance,0)
  };
}
function calcLoanSchedules(){
  const box = document.getElementById('loanCalc');
  if(!box) return;
  const schedules = computeLoanSchedules();
  if(!schedules.length){
    box.innerHTML = `<p class="calc-placeholder">Mark a funding source as "Loan / Debt" and add an amount, interest rate, and term to see an estimated monthly payment here.</p>`;
    return;
  }
  let html = '';
  schedules.forEach(s=>{
    const label = esc(s.source || 'Loan');
    if(!s.amortized){
      html += `<div style="margin-bottom:8px;"><strong>${label}:</strong> add an interest rate and term above to calculate a monthly payment.</div>`;
    } else {
      html += `<div style="margin-bottom:8px;"><strong>${label}:</strong> about ${fmtMoney(s.payment)}/month for ${s.term} months at ${s.rate}% APR (roughly ${fmtMoney(s.interestPaidY1)} in interest over Year 1).</div>`;
    }
  });
  box.innerHTML = `<div class="calc-result">${html}</div>`;
}

function computeCashFlow(){
  const inc = computeIncomeStatement();
  const funding = computeFundingTotals();
  const startupTotal = computeStartupTotal();
  const startingCash = parseNum(data.s4.startingCash) || 0;
  const loanPayments = computeQuarterlyLoanPayments();
  let beginning = startingCash;
  return [0,1,2,3].map(idx=>{
    const operating = inc.netIncome[idx] || 0;
    const investing = idx===0 ? -startupTotal : 0;
    const financing = (idx===0 ? funding.total : 0) - loanPayments[idx];
    const netChange = operating + investing + financing;
    const ending = beginning + netChange;
    const row = { beginning, operating, investing, financing, netChange, ending };
    beginning = ending;
    return row;
  });
}
function computeBalanceSheet(){
  const cashFlow = computeCashFlow();
  const endingCash = cashFlow[3].ending;
  const startupTotal = computeStartupTotal();
  const funding = computeFundingTotals();
  const inc = computeIncomeStatement();
  const startingCash = parseNum(data.s4.startingCash) || 0;
  const loanTotals = computeLoanTotals();
  const totalAssets = endingCash + startupTotal;
  const totalLiabilities = loanTotals.remaining;
  const retainedEarnings = inc.totals.netIncome - loanTotals.interest;
  const totalEquity = startingCash + funding.equity + retainedEarnings;
  return {
    cash: endingCash, assets: startupTotal, totalAssets,
    loans: totalLiabilities, totalLiabilities,
    ownerEquity: startingCash, investorEquity: funding.equity, retainedEarnings, totalEquity,
    totalLiabEquity: totalLiabilities + totalEquity
  };
}
function hasAnyFinancialData(){
  const payroll = computePayrollCost();

function isComplete(id){
  const d = data[id];
  if(!d) return false;
  function anyFilled(obj){
    if(Array.isArray(obj)) return obj.some(anyFilled);
    if(typeof obj === 'object' && obj !== null) return Object.values(obj).some(anyFilled);
    if(typeof obj === 'boolean') return obj;
    return obj && obj.toString().trim() !== '';
  }
  return anyFilled(d);
}

/* ---- Export / Import backup ---- */
async function exportPlanData(){
  const resumeFiles = {};
  for(const r of (data.appendix && data.appendix.resumes || [])){
    if(r.fileName){
      const du = await loadResumeFile(r.id);
      if(du) resumeFiles[r.id] = du;
    }
  }
  const docFiles = {};
  for(const r of (data.appendix && data.appendix.otherDocs || [])){
    if(r.fileName){
      const du = await loadDocFile(r.id);
      if(du) docFiles[r.id] = du;
    }
  }
  const bundle = { exportedAt: new Date().toISOString(), tool: 'mvsbdc-business-plan-builder', planData: data, resumeFiles, docFiles };
  const json = JSON.stringify(bundle, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const nameSafe = (data.business.name || 'my-business-plan').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'') || 'draft';
  const a = document.createElement('a');
  a.href = url;
  a.download = 'business-plan-backup-'+nameSafe+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  flashExported();
}
function triggerImport(){ document.getElementById('importFileInput').click(); }
function handleImportFile(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    try{
      const bundle = JSON.parse(e.target.result);
      if(!bundle || !bundle.planData) throw new Error('not a valid export file');
      if(!confirm('This will replace everything currently in the builder with the imported plan. Continue?')){
        inputEl.value = '';
        return;
      }
      data = deepMerge(defaultData(), bundle.planData);
      if(bundle.resumeFiles){
        for(const id in bundle.resumeFiles){
          await saveResumeFile(id, bundle.resumeFiles[id]);
        }
      }
      if(bundle.docFiles){
        for(const id in bundle.docFiles){
          await saveDocFile(id, bundle.docFiles[id]);
        }
      }
      scheduleSave();
      renderAll();
      alert('Your plan backup was opened.');
    }catch(err){
      alert("Couldn't read that file. Please choose a backup you downloaded from this builder.");
    }
    inputEl.value = '';
  };
  reader.readAsText(file);
}

function field(labelText, path, opts={}){

function dynTable(sectionKey, listKey, cols, addLabel){
  const list = data[sectionKey][listKey];
  let html = `<div class="table-scroll" tabindex="0" role="region" aria-label="${esc(addLabel.replace(/^Add /,''))} table"><table class="dyn-table"><thead><tr>`;
  cols.forEach(c=> html += `<th>${esc(c.label)}</th>`);
  html += `<th style="width:30px;"></th></tr></thead><tbody id="tbody-${sectionKey}-${listKey}">`;
  list.forEach((row,i)=>{ html += dynRow(sectionKey,listKey,cols,i); });
  html += `</tbody></table></div>
  <div style="margin-top:10px;margin-bottom:6px;"><button class="btn btn-outline btn-sm add-row-btn" onclick="addRow('${sectionKey}','${listKey}','${cols.map(c=>c.key).join('|')}')">+ ${esc(addLabel)}</button></div>`;
  return html;
}
function dynRow(sectionKey, listKey, cols, i){
  const row = data[sectionKey][listKey][i];
  let html = `<tr id="row-${sectionKey}-${listKey}-${i}">`;
  cols.forEach(c=>{
    const v = row[c.key]||'';
    const extra = c.onExtra || '';
    if(c.type === 'select'){
      let opts = `<option value=""${v===''?' selected':''}>Select...</option>`;
      (c.options||[]).forEach(o=>{ opts += `<option value="${esc(o)}"${v===o?' selected':''}>${esc(o)}</option>`; });
      html += `<td><select aria-label="${esc(c.label)}, row ${i+1}" onchange="data.${sectionKey}.${listKey}[${i}].${c.key}=this.value;scheduleSave();renderMain();${extra}">${opts}</select></td>`;
    } else {
      html += `<td><input type="text" aria-label="${esc(c.label)}, row ${i+1}" value="${esc(v)}" oninput="data.${sectionKey}.${listKey}[${i}].${c.key}=this.value;scheduleSave();${extra}"></td>`;
    }
  });
  html += `<td><button class="rm-row" title="Remove row" aria-label="Remove row ${i+1}" onclick="removeRow('${sectionKey}','${listKey}',${i})">&times;</button></td></tr>`;
  return html;
}
function addRow(sectionKey, listKey, keysStr){
  const keys = keysStr.split('|'); const obj = {};
  keys.forEach(k=>obj[k]='');
  data[sectionKey][listKey].push(obj); scheduleSave(); renderMain();
}
function removeRow(sectionKey, listKey, i){
  data[sectionKey][listKey].splice(i,1); scheduleSave(); renderMain();
}

  const file = inputEl.files && inputEl.files[0];

    alert('That file is larger than 1.5MB — please choose a smaller file. Your browser only has a small amount of space for saving files.');
    inputEl.value = '';

  const reader = new FileReader();

    if(entry){ entry.fileName = file.name; entry.mimeType = file.type; entry.size = file.size; }

    window.open(dataUrl, '_blank');

}

/* ============ DOCUMENT CONTENT GENERATORS ============ */
function docP(v){ return val(v) ? `<p class="doc-p">${val(v)}</p>` : ''; }
function docBlock(title, bodyHtml){
  return bodyHtml ? `<h3 class="doc-h3">${esc(title)}</h3>${bodyHtml}` : '';
}
function docTable(rows, cols){
  const anyData = (rows||[]).some(r => cols.some(c=>val(r[c.key])));
  if(!anyData) return '';
  let html = `<table><thead><tr>`;
  cols.forEach(c=> html += `<th>${esc(c.label)}</th>`);
  html += `</tr></thead><tbody>`;
  rows.forEach(r=>{
    if(!cols.some(c=>val(r[c.key]))) return;
    html += '<tr>'; cols.forEach(c=> html += `<td>${val(r[c.key])||''}</td>`); html += '</tr>';
  });
  html += '</tbody></table>';
  return html;
}
let WORD_EXPORT_MODE = false;

function bmcTableForWord(){
  const bmc = data.s1.bmc;
  const cell = v => val(v) || '—';
  function td(title, content, rowspan, colspan){
    const rs = rowspan ? ` rowspan="${rowspan}"` : '';
    const cs = colspan ? ` colspan="${colspan}"` : '';
    return `<td${rs}${cs} style="background:#F7F6F1;padding:6pt;vertical-align:top;font-size:10pt;"><strong style="color:#12355B;">${esc(title)}</strong><br>${esc(content)}</td>`;
  }
  return `<table border="1" cellspacing="0" cellpadding="0" style="width:100%;border-collapse:collapse;font-size:10pt;margin:10pt 0 18pt 0;">
    <tr>
      ${td('Key Partners', cell(bmc.partners), 2)}
      ${td('Key Activities', cell(bmc.activities))}
      ${td('Value Proposition', cell(bmc.value), 2)}
      ${td('Customer Relationships', cell(bmc.relationships))}
      ${td('Customer Segments', cell(bmc.segments), 2)}
    </tr>
    <tr>
      ${td('Key Resources', cell(bmc.resources))}
      ${td('Channels', cell(bmc.channels))}
    </tr>
    <tr>
      ${td('Cost Structure', cell(bmc.costs), null, 3)}
      ${td('Revenue Streams', cell(bmc.revenue), null, 2)}
    </tr>
  </table>`;
}
function swotTableForWord(){
  const s = data.s2.swot;
  const cell = v => val(v) || '—';
  function td(title, content){
    return `<td style="background:#F7F6F1;padding:8pt;vertical-align:top;font-size:10pt;width:50%;"><strong style="color:#12355B;">${esc(title)}</strong><br>${esc(content)}</td>`;
  }
  return `<table border="1" cellspacing="0" cellpadding="0" style="width:100%;border-collapse:collapse;font-size:10pt;margin:10pt 0 18pt 0;">
    <tr>${td('Strengths', cell(s.strengths))}${td('Weaknesses', cell(s.weaknesses))}</tr>

}

function renderTOC(order){
  let html = `<h2 class="doc-h2">Table of Contents</h2><ul class="doc-toc" id="docToc">`;
  order.forEach((key,i)=>{
    html += `<li data-section-key="${key}"><span>${i+1}. ${esc(SECTION_DEFS[key].title)}</span><span class="toc-page"></span></li>`;
  });
  html += `</ul>`;
  return html;
}
function buildStructuredDoc(format){
  const excluded = data.settings.excludedSections || [];
  const candidateOrder = FORMAT_ORDER[format].filter(key => !excluded.includes(key));
  // Compute each section's body first, then drop any that ended up with no actual content —
  // an entirely empty top-level section (e.g. nothing filled in Funding Request) shouldn't
  // print as an orphaned heading with nothing underneath.
  const rendered = candidateOrder
    .map(key => ({ key, def: SECTION_DEFS[key], body: SECTION_DEFS[key].gen() }))
    .filter(item => item.body && item.body.trim().length > 0);
  const finalOrder = rendered.map(r => r.key);

  let html = renderCover(format);
  html += renderTOC(finalOrder);
  rendered.forEach((item,i)=>{
    const sectionHtml = `<h2 class="doc-h2" data-section-key="${item.key}">${i+1}. ${esc(item.def.title)}</h2>${item.body}`;
    html += item.key === 'appendix' ? `<div class="doc-appendix-wrap">${sectionHtml}</div>` : sectionHtml;
  });
  return html;
}
function leanBlock(title, contentHtml){
  if(!contentHtml) return '';

function stylePicker(){
  let formatSwatches = '';
  Object.keys(FORMAT_META).forEach(key=>{

    formatSwatches += `<button type="button" class="swatch ${active}" aria-pressed="${!!active}" onclick="setFormat('${key}')">${esc(FORMAT_META[key].label)}</button>`;
  });
  let themeSwatches = '';
  Object.keys(THEME_META).forEach(key=>{
    const active = data.settings.theme === key ? 'active' : '';
    themeSwatches += `<button type="button" class="swatch ${active}" aria-pressed="${!!active}" onclick="setTheme('${key}')"><span class="dot" style="display:block;background:${THEME_META[key].dot};"></span>${esc(THEME_META[key].label)}</button>`;
  });

  let sectionsGroup;
  if(data.settings.format === 'lean'){
    sectionsGroup = `<div class="picker-group">
      <span class="picker-label">Sections to Include</span>
      <div class="picker-desc">Not available in the Lean One-Page format — it's a fixed single-page snapshot.</div>
    </div>`;
  } else {
    const order = FORMAT_ORDER[data.settings.format];
    const excluded = data.settings.excludedSections || [];
    let checkboxes = '';
    order.forEach(key=>{
      const checked = excluded.includes(key) ? '' : 'checked';
      checkboxes += `<label class="section-toggle"><input type="checkbox" ${checked} onchange="toggleSectionExclusion('${key}')"> ${esc(SECTION_DEFS[key].title)}</label>`;
    });

      <div class="section-toggle-list">${checkboxes}</div>
      <div class="picker-desc">Uncheck a section to leave it out of the printed plan, PDF, and Word doc.</div>

  }

  return `<div class="style-picker">
    <div class="picker-group">
      <span class="picker-label">Plan Format</span>
      <div class="swatch-row">${formatSwatches}</div>
      <div class="picker-desc">${esc(FORMAT_META[data.settings.format].desc)}</div>
    </div>
    <div class="picker-group">
      <span class="picker-label">Visual Style</span>
      <div class="swatch-row">${themeSwatches}</div>
    </div>

}

function setTheme(t){ data.settings.theme = t; scheduleSave(); renderMain(); }
function toggleSectionExclusion(key){
  if(!data.settings.excludedSections) data.settings.excludedSections = [];
  const idx = data.settings.excludedSections.indexOf(key);

}

async function buildWordBodyHtml(){
  const format = data.settings.format;
  WORD_EXPORT_MODE = true;
  let bodyHtml;
  try{ bodyHtml = buildDoc(format); }
  finally{ WORD_EXPORT_MODE = false; }

  // Bake uploaded photos directly into the HTML string as data URLs (no live DOM to hydrate into for a file export)
  async function bakeImages(list, loaderFn, idPrefix){
    for(const r of list){
      if(r.fileName && r.mimeType && r.mimeType.startsWith('image/')){
        const dataUrl = await loaderFn(r.id);
        if(dataUrl){
          const placeholder = new RegExp('<div id="'+idPrefix+r.id+'"[^>]*>[\\s\\S]*?<\\/div>');
          bodyHtml = bodyHtml.replace(placeholder, `<img src="${dataUrl}" style="max-width:220px;">`);
        }
      }
    }
  }
  await bakeImages((data.appendix && data.appendix.resumes) || [], loadResumeFile, 'resume-img-');
  await bakeImages((data.appendix && data.appendix.otherDocs) || [], loadDocFile, 'doc-img-');
  return bodyHtml;
}

/* ============ RENDER ORCHESTRATION ============ */
const PRINT_CONTENT_WIDTH_PX = 672; // 7in content width at 96dpi (8.5in letter - 0.75in side margins)
const PRINT_PAGE_HEIGHT_PX = 902;   // 9.4in content height at 96dpi (11in letter - 0.75in top - 0.85in bottom margins)

function updateTocPageEstimates(){
  const source = document.getElementById('docContent');
  if(!source) return;
  const toc = source.querySelector('#docToc');
  if(!toc) return; // lean format has no TOC — nothing to estimate

  const clone = source.cloneNode(true);
  clone.style.cssText = 'position:absolute;visibility:hidden;left:-9999px;top:0;'
    + 'width:'+PRINT_CONTENT_WIDTH_PX+'px;max-width:'+PRINT_CONTENT_WIDTH_PX+'px;'
    + 'padding:0;margin:0;box-shadow:none;';
  document.body.appendChild(clone);

  const headings = Array.from(clone.querySelectorAll('h2.doc-h2[data-section-key]'));
  const pageForOffset = top => Math.floor(top / PRINT_PAGE_HEIGHT_PX) + 1;

  headings.forEach(h=>{
    const key = h.getAttribute('data-section-key');
    const tocLi = toc.querySelector('li[data-section-key="'+key+'"]');
    if(!tocLi) return;
    const span = tocLi.querySelector('.toc-page');
    if(!span) return;
    span.textContent = key === 'appendix' ? '' : String(pageForOffset(h.offsetTop));
  });

  document.body.removeChild(clone);
}

function renderMain(){
  const main = document.getElementById('main');
  let bodyHtml = '';
  if(currentSection === 'preview'){
    bodyHtml = viewPreview();
  } else {
    bodyHtml = `<div class="topbar"><span></span><span class="save-indicator" id="saveIndicator">&#10003; Saved</span></div>` + ({
      instructions: viewInstructions, business: viewBusiness, s1: viewS1, s2: viewS2, s3: viewS3, s4: viewS4,
      s5: viewS5, s6: viewS6, s7: viewS7, exec: viewExec
    }[currentSection])();
  }
  main.innerHTML = bodyHtml;
  if(currentSection === 'preview'){ hydrateResumeImages(); updateTocPageEstimates(); }
  if(currentSection === 's4'){ calcBreakEven(); calcRevenueForecast(); }
  if(currentSection === 's6'){ calcLoanSchedules(); calcPayroll(); }
}
function renderAll(){ renderRail(); renderMain(); }

async function hydrateImageSlots(list, loaderFn, idPrefix){
  for(const r of list){
    if(r.fileName && r.mimeType && r.mimeType.startsWith('image/')){
      const dataUrl = await loaderFn(r.id);
      const slot = document.getElementById(idPrefix+r.id);
      if(slot){
        slot.innerHTML = dataUrl
          ? `<img src="${dataUrl}" alt="${esc(r.label||'Photo')}" style="max-width:220px;border-radius:6px;border:1px solid #ddd;display:block;">`
          : `<span class="empty">Could not load image.</span>`;
      }
    }
  }
}
async function hydrateResumeImages(){
  await hydrateImageSlots((data.appendix && data.appendix.resumes) || [], loadResumeFile, 'resume-img-');
  await hydrateImageSlots((data.appendix && data.appendix.otherDocs) || [], loadDocFile, 'doc-img-');
}

loadData();
</script>
