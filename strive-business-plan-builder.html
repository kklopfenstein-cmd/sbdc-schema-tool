function refreshFin(){
  const ids = ['uofBox','finLinesBox','finInvBox','seasonBox','collectBox','finExpBox','finStartupBox','payrollCalc','loanCalc'];
  if(!ids.some(id=>document.getElementById(id))) return;
  const pf = runProForma();
  const put = (id, html) => { const el = document.getElementById(id); if(el) el.innerHTML = html; };
  // use of funds total
  { const rows = data.s6.useOfFunds||[]; const tot = rows.reduce((a,r)=>a+N(r.amount),0);
    put('uofBox', tot ? `<div class="calc-result"><strong>Total use of funds:</strong> ${fmtMoney(tot)}${pf.fund.total ? (Math.abs(tot-pf.fund.total)<1 ? ` ✓ matches your ${fmtMoney(pf.fund.total)} in funding.` : ` · your funding is ${fmtMoney(pf.fund.total)} (${tot>pf.fund.total?'short by '+fmtMoney(tot-pf.fund.total):fmtMoney(pf.fund.total-tot)+' not yet assigned'}).`) : ''}</div>` : `<p class="calc-placeholder">Enter amounts to see the total.</p>`); }
  // inventory
  if(pf.invDays>0 || pf.st.inv>0){
    const avgInv = sumArr(pf.inventory.slice(0,12))/12, cogsY1 = sumArr(pf.cogs.slice(0,12))/12;
    put('finInvBox', `<div class="calc-result"><strong>Inventory:</strong> about ${fmtMoney(avgInv)} on hand in an average Year 1 month (${fmtNum(pf.invDays,0)} days of the ${fmtMoney(cogsY1)} in direct costs you sell each month)${pf.st.inv?`, starting from ${fmtMoney(pf.st.inv)} of opening inventory`:''}. Ending inventory: Year 1 ${fmtMoney(pf.years[0].endInventory)} · Year 2 ${fmtMoney(pf.years[1].endInventory)} · Year 3 ${fmtMoney(pf.years[2].endInventory)}. Buying more stock as sales grow uses cash, so it shows on your Cash Flow, and the stock shows as an asset on your Balance Sheet.</div>`);
  } else put('finInvBox', `<p class="calc-placeholder">Enter the days of inventory you keep on hand (or add Opening Inventory in startup costs) to include stock in your cash flow and balance sheet.</p>`);
  // revenue lines
  if(pf.lines.length){
    const y1 = pf.years[0];
    const per = pf.lines.map(l=>{
      const m = l.price ? (l.price-l.cost)/l.price : NaN;
      return `<div><strong>${esc(l.name)}:</strong> ${fmtMoney2(l.price-l.cost)} gross margin per sale (${fmtPct(m)}) · Year 1 revenue about ${fmtMoney(sumArr(l.rev.slice(0,12)))}</div>`;
    }).join('');
    put('finLinesBox', `<div class="calc-result">${per}<div style="margin-top:8px;padding-top:8px;border-top:1px solid #b9cdb9;"><strong>Year 1 revenue:</strong> ${fmtMoney(y1.revenue)} · Year 2: ${fmtMoney(pf.years[1].revenue)} · Year 3: ${fmtMoney(pf.years[2].revenue)}</div></div>`);
  } else put('finLinesBox', `<p class="calc-placeholder">Add a price and sales per month for at least one product or service to see your projected revenue.</p>`);
  const s = (data.s4.seasonality||[]).map(v=>N(v,1)), avg = sumArr(s)/12;
  put('seasonBox', Math.abs(avg-1) <= 0.02
    ? `<p class="calc-placeholder">Average: ${avg.toFixed(2)} ✓</p>`
    : `<div class="calc-warning">The 12 months average ${avg.toFixed(2)}, not 1.00, so your yearly sales will come out about ${fmtPct(avg-1,0)} ${avg>1?'higher':'lower'} than "sales per month × 12". Adjust the months if that isn't what you meant.</div>`);
  const ct = pf.collectTotal;
  put('collectBox', Math.abs(ct-1) < 0.001 ? `<p class="calc-placeholder">Total: 100% ✓</p>`
    : `<div class="calc-warning">These add up to ${fmtPct(ct,0)}. They should add up to 100%${ct<1?'; anything left over is treated as never collected':''}.</div>`);
  const fixedY1 = sumArr(pf.fixedTotal.slice(0,12))/12, draw = N(data.s4.ownerDraw);
  put('finExpBox', `<div class="calc-result"><strong>Monthly operating expenses:</strong> ${fmtMoney(fixedY1)}${draw?` + ${fmtMoney(draw)} owner draw`:''}. Team costs and loan payments from Step 6 are added in your projections.</div>`);
  if(pf.st.total || pf.fund.total){
    put('finStartupBox', `<div class="calc-result"><strong>Startup costs:</strong> ${fmtMoney(pf.st.total)} total (equipment ${fmtMoney(pf.st.equip)}${pf.st.inv?`, opening inventory ${fmtMoney(pf.st.inv)}`:''}, prepaid ${fmtMoney(pf.st.prepaid)}, other startup expenses ${fmtMoney(pf.st.expense)}, working capital reserve ${fmtMoney(pf.st.wc)}).<br>
      <strong>Funding:</strong> ${fmtMoney(pf.fund.total)} (your cash ${fmtMoney(pf.fund.owner)}${pf.fund.loans?`, loans ${fmtMoney(pf.fund.loans)}`:''}${pf.fund.equity?`, investors ${fmtMoney(pf.fund.equity)}`:''}${pf.fund.grants?`, grants ${fmtMoney(pf.fund.grants)}`:''}).
      ${Math.abs(pf.fund.total-pf.st.total)<1?'✓ Funding matches startup costs.': pf.fund.total>pf.st.total? `${fmtMoney(pf.fund.total-pf.st.total)} more funding than startup costs; it stays in the bank as cash.` : `<span style="color:#9C3B3B;font-weight:700;">You're ${fmtMoney(pf.st.total-pf.fund.total)} short of your startup costs.</span> Add funding in Step 6 or lower costs.`}</div>`);
  } else put('finStartupBox', `<p class="calc-placeholder">Add startup items and your investment to compare what you need with what you have.</p>`);
  // payroll
  const y1 = a => sumArr(a.slice(0,12));
  if(pf.roles.length){
    const w = y1(pf.wages), tx = y1(pf.payrollTaxes), b = y1(pf.benefits), c = y1(pf.contractors);
    put('payrollCalc', `<div class="calc-result"><strong>Year 1 team cost:</strong> ${fmtMoney(w)} employee wages + ${fmtMoney(tx)} employer payroll taxes${w?` (${fmtPct(tx/w,2)} of wages)`:''}${b?` + ${fmtMoney(b)} benefits`:''}${c?` + ${fmtMoney(c)} contractors`:''} = <strong>${fmtMoney(w+tx+b+c)}</strong> (about ${fmtMoney((w+tx+b+c)/12)} per month).
      ${w?`<div style="margin-top:6px;">Payroll taxes, Year 1: Social Security ${fmtMoney(y1(pf.taxSS))} · Medicare ${fmtMoney(y1(pf.taxMed))} · FUTA ${fmtMoney(y1(pf.taxFUTA))} · SUTA ${fmtMoney(y1(pf.taxSUTA))} · workers' comp ${fmtMoney(y1(pf.taxWC))}.</div>`:''}</div>`);
  } else put('payrollCalc', `<p class="calc-placeholder">Add an hourly rate and hours per week for each role to calculate wages and employer payroll taxes.</p>`);
  if(pf.loans.length){
    put('loanCalc', `<div class="calc-result">${pf.loans.map(l=> l.hasTerms
      ? `<div><strong>${esc(l.source)}:</strong> about ${fmtMoney(l.payment)}/month for ${l.term} months at ${l.rate}% (Year 1: ${fmtMoney(sumArr(l.interest.slice(0,12)))} interest, ${fmtMoney(sumArr(l.principal.slice(0,12)))} principal).</div>`
      : `<div><strong>${esc(l.source)}:</strong> add an interest rate and term to calculate the payment.</div>`).join('')}</div>`);
  } else put('loanCalc', `<p class="calc-placeholder">Mark a funding source as "Loan / Debt" with an amount, interest rate and term to see the monthly payment.</p>`);
}

function viewProj(){
  const nav = `<div class="nav-footer"><button class="btn btn-outline" onclick="goTo('s6')">← Back</button><button class="btn btn-primary" onclick="goTo('s7')">Next: Finalize &amp; Review →</button></div>`;

/* ---- Text formatting: **bold**, *italic*, __underline__ typed in any box print as formatting ---- */
function fmtInline(h){
  if(!h) return h;
  return h.replace(/\*\*(?=\S)([^\n]*?\S)\*\*/g, '<strong>$1</strong>')
          .replace(/__(?=\S)([^\n]*?\S)__/g, '<u>$1</u>')
          .replace(/(^|[^*\w])\*(?=\S)([^*\n]*?\S)\*(?![*\w])/g, '$1<em>$2</em>');
}
function fmtVal(v){ const t = val(v); return t ? fmtInline(t) : t; }
function fmtWrap(id, mark){
  const ta = document.getElementById(id); if(!ta) return;
  const s = ta.selectionStart, e = ta.selectionEnd, v = ta.value, sel = v.slice(s, e), L = mark.length;
  if(sel.length >= 2*L && sel.startsWith(mark) && sel.endsWith(mark)){
    const inner = sel.slice(L, sel.length-L);
    ta.value = v.slice(0,s) + inner + v.slice(e); ta.setSelectionRange(s, s+inner.length);
  } else if(s >= L && v.slice(s-L, s) === mark && v.slice(e, e+L) === mark && !(mark === '*' && (v[s-L-1] === '*' || v[e+L] === '*'))){
    ta.value = v.slice(0, s-L) + sel + v.slice(e+L); ta.setSelectionRange(s-L, e-L);
  } else if(!sel){
    ta.value = v.slice(0,s) + mark + mark + v.slice(e); ta.setSelectionRange(s+L, s+L);
  } else {
    const out = sel.split('\n').map(line => {
      const m = line.match(/^(\s*(?:[•\-–]\s+|\d+[.)]\s+)?)(.*?)(\s*)$/);
      return m && m[2] ? m[1] + mark + m[2] + mark + m[3] : line;
    }).join('\n');
    ta.value = v.slice(0,s) + out + v.slice(e); ta.setSelectionRange(s, s+out.length);
  }
  ta.focus(); ta.dispatchEvent(new Event('input', {bubbles:true}));
}
function fmtBar(id){
  const b = (mark, label, title, style) => `<button type="button" class="fmt-btn" title="${title}" aria-label="${title}" onmousedown="event.preventDefault()" onclick="fmtWrap('${id}','${mark}')"><span style="${style}">${label}</span></button>`;
  return `<div class="fmt-bar" role="toolbar" aria-label="Text formatting">${b('**','B','Bold (Ctrl+B)','font-weight:800;')}${b('*','I','Italic (Ctrl+I)','font-style:italic;font-family:Georgia,serif;')}${b('__','U','Underline (Ctrl+U)','text-decoration:underline;')}<span class="fmt-tip">Select words, then click. Prints as formatting in your plan.</span></div>`;
}
document.addEventListener('keydown', e => {
  if(!(e.ctrlKey || e.metaKey) || e.altKey || e.shiftKey) return;
  const t = e.target; if(!t || t.tagName !== 'TEXTAREA' || !t.id) return;
  const k = (e.key||'').toLowerCase(); const mark = k==='b' ? '**' : k==='i' ? '*' : k==='u' ? '__' : null;
  if(mark){ e.preventDefault(); fmtWrap(t.id, mark); }
});
/* ---- Footnotes: notes & sources print together near the end of the plan, before the Appendix ----
   [[text]] anywhere in a field becomes a footnote; a line starting with "Sources:" or "Note:" does too. */
let FN_ACTIVE = false, FOOTNOTES = [];
function fnAdd(html){
  const t = (html||'').trim(); if(!t) return '';
  let i = FOOTNOTES.indexOf(t); if(i === -1){ FOOTNOTES.push(t); i = FOOTNOTES.length-1; }
  return `<sup class="fn-ref">${i+1}</sup>`;
}
function fnText(raw){
  if(!raw || !raw.toString().trim()) return null;
  raw = raw.toString();
  if(!FN_ACTIVE) return fmtInline(esc(raw.replace(/\[\[([\s\S]*?)\]\]/g, '($1)')));
  const notes = [];
  let s = raw.replace(/[ \t]*\[\[([\s\S]*?)\]\]/g, (m, n) => { notes.push(n.trim()); return '\u0001' + (notes.length-1) + '\u0002'; });
  const keep = [], tail = [];
  s.split('\n').forEach(l => { if(/^\s*(sources?|notes?)\s*:/i.test(l)) tail.push(l.trim()); else keep.push(l); });
  s = keep.join('\n').replace(/\s+$/, '');
  let out = esc(s).replace(/\u0001(\d+)\u0002/g, (m, k) => fnAdd(fmtInline(esc(notes[+k]))));
  tail.forEach(t => { out += fnAdd(fmtInline(esc(t))); });
  return fmtInline(out);
}
function fnList(){
  return FOOTNOTES.length ? `<ol class="doc-notes">${FOOTNOTES.map((n,i)=>`<li id="fn-${i+1}">${n}</li>`).join('')}</ol>` : '';
}
function fnAttach(html, sup){ return sup && html ? html.replace('</h3>', sup + '</h3>') : html; }

function docTable(rows, cols){
  const anyData = (rows||[]).some(r => cols.some(c=>val(r[c.key])));
  if(!anyData) return '';
  let html = `<table><thead><tr>`;
  cols.forEach(c=> html += `<th>${esc(c.label)}</th>`);

    html += '<tr>'; cols.forEach(c=> html += `<td>${fnText(r[c.key])||''}</td>`); html += '</tr>';

  html += '</tbody></table>';
  return html;

function renderTOC(order){
  let html = `<h2 class="doc-h2">Table of Contents</h2><ul class="doc-toc" id="docToc">`;
  order.forEach((key,i)=>{
    html += `<li data-section-key="${key}"><span>${i+1}. ${esc(SECTION_DEFS[key].title)}</span><span class="toc-page"></span></li>`;
  });
  html += `</ul>`;
  return html;
}
function buildStructuredDoc(format){
  const excluded = data.settings.excludedSections || [];
  const candidateOrder = FORMAT_ORDER[format].filter(key => !excluded.includes(key));
  // Compute each section's body first, then drop any that ended up with no actual content —
  // an entirely empty top-level section (e.g. nothing filled in Funding Request) shouldn't
  // print as an orphaned heading with nothing underneath.
  FN_ACTIVE = candidateOrder.includes('notes'); FOOTNOTES = [];
  const all = candidateOrder.map(key => ({ key, def: SECTION_DEFS[key], body: key === 'notes' ? '' : SECTION_DEFS[key].gen() }));
  const notesItem = all.find(x => x.key === 'notes');
  if(notesItem) notesItem.body = fnList() ? `<p class="doc-p" style="font-size:12.5px;">Numbered notes and sources referenced throughout this plan.</p>` + fnList() : '';
  FN_ACTIVE = false;
  const rendered = all.filter(item => item.body && item.body.trim().length > 0);
  const finalOrder = rendered.map(r => r.key);

  let html = renderCover(format);
  html += renderTOC(finalOrder);
  if(wideDocIncluded(format)) html = html.replace('</ul>', `<li data-section-key="statements"><span>Appendix B: Projected Financial Statements</span><span class="toc-page"></span></li></ul>`);
  rendered.forEach((item,i)=>{
    const sectionHtml = `<h2 class="doc-h2" data-section-key="${item.key}">${i+1}. ${esc(item.def.title)}</h2>${item.body}`;
    html += item.key === 'appendix' ? `<div class="doc-appendix-wrap">${sectionHtml}</div>` : sectionHtml;
  });
  return html.replace(/<\/sup><sup class="fn-ref">/g, ',');
}

  const swotLine = [

  html += leanBlock('Financial Snapshot', finSnapshot? `<p class="doc-p">${finSnapshot}</p>` : docP(''));
  html += leanBlock('Funding Ask', docP(ex.fundingUse));
  html += WORD_EXPORT_MODE ? '' : `</div>`;
  return html;

async function buildWordBodyHtml(){
  const format = data.settings.format;
  WORD_EXPORT_MODE = true;
  let bodyHtml;
  try{ bodyHtml = buildDoc(format); }
  finally{ WORD_EXPORT_MODE = false; }

  // Bake uploaded photos directly into the HTML string as data URLs (no live DOM to hydrate into for a file export)
  async function bakeImages(list, loaderFn, idPrefix){
    for(const r of list){
      if(r.fileName && r.mimeType && r.mimeType.startsWith('image/')){
        const dataUrl = await loaderFn(r.id);
        if(dataUrl){
          const placeholder = new RegExp('<div id="'+idPrefix+r.id+'"[^>]*>[\\s\\S]*?<\\/div>');
          bodyHtml = bodyHtml.replace(placeholder, `<img src="${dataUrl}" style="max-width:220px;">`);
        }
      }
    }
  }
  await bakeImages((data.appendix && data.appendix.resumes) || [], loadResumeFile, 'resume-img-');
  await bakeImages((data.appendix && data.appendix.otherDocs) || [], loadDocFile, 'doc-img-');
  if(data.business.logo && data.business.logo.fileName){
    const du = await loadLogoFile();
    bodyHtml = bodyHtml.replace(/<div class="doc-logo" id="doc-logo-slot">[\s\S]*?<\/div>/, du ? `<p style="text-align:center;margin:0 0 12pt 0;"><img src="${du}" style="max-height:110px;max-width:280px;" height="100"></p>` : '');
  }
  return bodyHtml;
}

function viewPreview(){
  const format = data.settings.format, theme = data.settings.theme;
  const effTheme = (theme === 'brand' && !hasBrandColors()) ? 'classic' : theme;
  const vars = themeVars(effTheme) + fontVars();
  const fontCls = (data.settings.headFont ? ' custom-head' : '') + (data.settings.bodyFont ? ' custom-body' : '');
  const wide = buildWideDoc(format);
  const everyNote = confEvery() ? `<div class="conf-every-sample"><span>Bottom of every printed page:</span> <span class="conf-live">${esc(confText())}</span></div>` : '';
  const docHtml = `<div class="doc theme-${effTheme}${fontCls}" id="docContent" style="${vars}">${buildDoc(format)}${everyNote}</div>`
    + (wide ? `<div class="doc doc-wide theme-${effTheme}${fontCls}" id="docWide" style="${vars}"><div class="wide-tag">Landscape pages</div>${wide}</div>` : '');
  return `<div class="topbar" style="margin-bottom:6px;">
    <h2 class="section-title" style="margin:0;">Preview &amp; Print</h2>
    <div><button class="btn btn-outline" onclick="goTo('exec')">← Back to Editing</button>

    <button class="btn btn-gold" onclick="window.print()">Print / Save as PDF</button></div>
  </div>
  ${stylePicker()}
  ${confPanel()}
  <style id="confStyle">${confPrintCss()}</style>
  <div class="preview-wrap">${docHtml}</div>
  <div class="cta"><strong>Ready for feedback?</strong> An SBDC advisor can review your plan with you before you share it with a lender or investor, at no cost. <a href="https://clients.ohiosbdc.ohio.gov/reg.aspx?mode=counsel&amp;center=17047&amp;subloc=0">Request advising</a> or call <a href="tel:+19372109460">937-210-9460</a>.</div>`;
}

/* ============ RENDER ORCHESTRATION ============ */
const PRINT_CONTENT_WIDTH_PX = 672; // 7in content width at 96dpi (8.5in letter - 0.75in side margins)
const PRINT_PAGE_HEIGHT_PX = 902;   // 9.4in content height at 96dpi (11in letter - 0.75in top - 0.85in bottom margins)

function updateTocPageEstimates(){
  const source = document.getElementById('docContent');
  if(!source) return;
  const toc = source.querySelector('#docToc');
  if(!toc) return; // lean format has no TOC — nothing to estimate

  const clone = source.cloneNode(true);
  clone.style.cssText = 'position:absolute;visibility:hidden;left:-9999px;top:0;'
    + 'width:'+PRINT_CONTENT_WIDTH_PX+'px;max-width:'+PRINT_CONTENT_WIDTH_PX+'px;'
    + 'padding:0;margin:0;box-shadow:none;';
  document.body.appendChild(clone);

  const headings = Array.from(clone.querySelectorAll('h2.doc-h2[data-section-key]'));
  const cover = clone.querySelector('.doc-cover'), mark = clone.querySelector('.page-break-mark');
  const base = mark ? mark.offsetTop + mark.offsetHeight : 0;
  const pageForOffset = top => Math.floor((top - base) / PRINT_PAGE_HEIGHT_PX) + (cover ? 2 : 1);

  headings.forEach(h=>{
    const key = h.getAttribute('data-section-key');
    const tocLi = toc.querySelector('li[data-section-key="'+key+'"]');
    if(!tocLi) return;
    const span = tocLi.querySelector('.toc-page');
    if(!span) return;
    span.textContent = key === 'appendix' ? '' : String(pageForOffset(h.offsetTop));
  });

  document.body.removeChild(clone);
}

function renderMain(){
  const main = document.getElementById('main');
  let bodyHtml = '';
  if(currentSection === 'preview'){
    bodyHtml = viewPreview();
  } else {
    bodyHtml = `<div class="topbar"><span></span><span class="save-indicator" id="saveIndicator">&#10003; Saved</span></div>` + ({
      instructions: viewInstructions, business: viewBusiness, s1: viewS1, s2: viewS2, s3: viewS3, s4: viewS4,
      s5: viewS5, s6: viewS6, proj: viewProj, s7: viewS7, exec: viewExec
    }[currentSection])();
  }
  main.innerHTML = bodyHtml;
  main.classList.toggle('wide', currentSection === 'proj' || currentSection === 'preview');
  if(currentSection === 'preview'){ hydrateResumeImages(); hydrateLogo(); updateTocPageEstimates(); }
  if(currentSection === 'business'){ hydrateLogo(); }
  if(currentSection === 's4' || currentSection === 's6'){ refreshFin(); }
}
function renderAll(){ renderRail(); renderMain(); }

async function hydrateImageSlots(list, loaderFn, idPrefix){
  for(const r of list){
    if(r.fileName && r.mimeType && r.mimeType.startsWith('image/')){
      const dataUrl = await loaderFn(r.id);
      const slot = document.getElementById(idPrefix+r.id);
      if(slot){
        slot.innerHTML = dataUrl
          ? `<img src="${dataUrl}" alt="${esc(r.label||'Photo')}" style="max-width:220px;border-radius:6px;border:1px solid #ddd;display:block;">`
          : `<span class="empty">Could not load image.</span>`;
      }
    }
  }
}
async function hydrateResumeImages(){
  await hydrateImageSlots((data.appendix && data.appendix.resumes) || [], loadResumeFile, 'resume-img-');
  await hydrateImageSlots((data.appendix && data.appendix.otherDocs) || [], loadDocFile, 'doc-img-');
}
